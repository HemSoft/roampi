name: RoamPi
options:
  bundleIdPrefix: com.hemsoft
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "27.0"
  createIntermediateGroups: true
packages:
  RoamPiCore:
    path: Packages/RoamPiCore
  swiftterm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.19.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  RoamPi:
    type: application
    platform: iOS
    sources:
      - path: RoamPi
    dependencies:
      - package: RoamPiCore
        product: RoamPiCore
      - package: swiftterm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hemsoft.RoamPi
        CODE_SIGN_ENTITLEMENTS: RoamPi/RoamPi.entitlements
        PRODUCT_NAME: RoamPi
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RoamPi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - RoamPiTests
        - RoamPiUITests
      gatherCoverageData: true
  RoamPiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoamPiTests
    dependencies:
      - target: RoamPi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hemsoft.RoamPiTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RoamPi.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RoamPi"
        BUNDLE_LOADER: "$(TEST_HOST)"
  RoamPiIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RoamPiIntegrationTests
    dependencies:
      - package: RoamPiCore
        product: RoamPiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hemsoft.RoamPiIntegrationTests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    scheme:
      testTargets:
        - RoamPiIntegrationTests
      gatherCoverageData: false
  RoamPiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RoamPiUITests
    dependencies:
      - target: RoamPi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hemsoft.RoamPiUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RoamPi
