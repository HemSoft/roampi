name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint-audit:
    name: Xcode build, test, lint, and dependency audit
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.6

      - name: Install SwiftFormat
        run: |
          brew install swiftformat
          swiftformat --version

      - name: Record toolchain and simulator versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep 'iPhone 17'

      - name: Build and test iPhone 17
        run: |
          xcodebuild -project RoamPi.xcodeproj -scheme RoamPi -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' build
          xcodebuild -project RoamPi.xcodeproj -scheme RoamPi -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' test

      - name: Check Swift formatting
        run: swiftformat --lint .

      - name: Resolve and audit dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          xcodebuild -resolvePackageDependencies -project RoamPi.xcodeproj -scheme RoamPi
          ./scripts/audit-dependencies.sh
